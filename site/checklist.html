<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="wrap">
  <nav class="topnav">
    <a href="index.html">← 所有產品</a><span class="sp"></span>
    <a class="pill-link" href="favorites.html">♥ 我的最愛</a>
  </nav>
  <h1 id="title">載入中…</h1>
  <div class="sub" id="subtitle"></div>
  <div class="seg viewtoggle" id="view" hidden>
    <button class="btn on" data-v="list">清單</button>
    <button class="btn" data-v="stats">統計</button>
  </div>

  <div class="panel" id="controls" hidden>
    <div class="row">
      <input id="search" class="input" type="search" placeholder="搜尋球員、卡號、球隊…" autocomplete="off">
    </div>
    <div class="row" id="groups"></div>
    <div class="row pills" id="sets"></div>
    <div class="row">
      <select id="team" class="select"></select>
      <select id="sort" class="select">
        <option value="order">原始順序</option>
        <option value="number">按卡號排序</option>
        <option value="player">按球員排序</option>
        <option value="team">按球隊排序</option>
      </select>
      <div class="seg" id="rc">
        <button class="btn on" data-v="All">全部</button>
        <button class="btn rc" data-v="RC">RC</button>
        <button class="btn" data-v="Non-RC">非RC</button>
      </div>
      <div class="seg" id="first" hidden>
        <button class="btn on" data-v="All">全部</button>
        <button class="btn first" data-v="1st">1st</button>
        <button class="btn" data-v="Non-1st">非1st</button>
      </div>
      <button class="btn fav" id="favonly">♥ 只看最愛</button>
    </div>
  </div>

  <div class="count" id="count"></div>
  <div id="list"></div>
</div>
<script src="assets/common.js"></script>
<script>
const slug = new URLSearchParams(location.search).get("p") || "";
let PROD = null;
const S = { q: "", group: "All", set: "All", team: "All", sort: "order", rc: "All", first: "All", fav: false, view: "list" };
const OPEN = new Set();     // expanded stats rows ("team:..." / "player:...")
const SHOW_ALL = new Set(); // stats lists showing more than the top 15
const TOP = 15;
const $ = id => document.getElementById(id);

function matches(c, i) {
  if (S.group !== "All" && c.group !== S.group) return false;
  if (S.set !== "All" && c.set !== S.set) return false;
  if (S.team !== "All" && !splitMulti(c.team).some(t => franchise(t) === S.team)) return false;
  if (S.rc === "RC" && !c.rc) return false;
  if (S.rc === "Non-RC" && c.rc) return false;
  if (S.first === "1st" && !c.first) return false;
  if (S.first === "Non-1st" && c.first) return false;
  if (S.fav && !Fav.hasCard(slug, c) && !Fav.anyPlayer(c.player)) return false;
  if (S.q) {
    const hay = playerKey([c.player, c.no, c.team, c.set, c.note, (c.tags || []).join(" "), c.first ? "1st" : ""].join(" "));
    if (!playerKey(S.q).split(" ").every(w => hay.includes(w))) return false;
  }
  return true;
}

function renderControls() {
  const groups = ["All", ...PROD.groups.filter(g => PROD.cards.some(c => c.group === g))];
  $("groups").innerHTML = `<div class="seg">${groups.map(g =>
    `<button class="btn ${S.group === g ? "on" : ""}" data-v="${esc(g)}">${g === "All" ? "全部" : esc(g)}</button>`).join("")}</div>`;
  const sets = [...new Set(PROD.cards.filter(c => S.group === "All" || c.group === S.group).map(c => c.set))];
  $("sets").innerHTML = sets.length > 1 ? ["All", ...sets].map(s =>
    `<button class="pill ${S.set === s ? "on" : ""}" data-v="${esc(s)}">${s === "All" ? "所有子系列" : esc(s)}</button>`).join("") : "";
  const teams = [...new Set(PROD.cards.flatMap(c => splitMulti(c.team).map(franchise)))].sort();
  $("team").innerHTML = `<option value="All">所有球隊</option>` + teams.map(t =>
    `<option value="${esc(t)}" ${S.team === t ? "selected" : ""}>${esc(t)}</option>`).join("");
  document.querySelectorAll("#rc .btn").forEach(b => b.classList.toggle("on", b.dataset.v === S.rc));
  document.querySelectorAll("#first .btn").forEach(b => b.classList.toggle("on", b.dataset.v === S.first));
  $("favonly").classList.toggle("on", S.fav);
}

function renderList() {
  let rows = PROD.cards.map((c, i) => [c, i]).filter(([c, i]) => matches(c, i));
  $("sort").hidden = S.view === "stats";
  const by = {
    number: (a, b) => collator.compare(a[0].no, b[0].no),
    player: (a, b) => collator.compare(a[0].player, b[0].player),
    team: (a, b) => collator.compare(franchise(a[0].team), franchise(b[0].team)) || collator.compare(a[0].no, b[0].no),
  }[S.sort];
  const filtered = S.q || S.group !== "All" || S.set !== "All" || S.team !== "All" || S.rc !== "All" || S.first !== "All" || S.fav;
  $("count").innerHTML = `顯示 <strong>${rows.length}</strong> / ${PROD.cards.length} 張卡片` +
    (filtered ? `<button class="linkbtn" id="clear">清除篩選</button>` : "");
  if (!rows.length) { $("list").innerHTML = `<div class="empty">${S.fav ? "這個產品還沒有最愛的卡片或球員" : "沒有符合條件的卡片"}</div>`; return; }
  if (S.view === "stats") { $("list").innerHTML = renderStats(rows); return; }

  if (by) { rows.sort(by); $("list").innerHTML = `<div class="cards">${rows.map(([c, i]) => cardRow(slug, c, i)).join("")}</div>`; return; }
  // Original order: grouped by set with a heading.
  let html = "", cur = null, buf = [];
  const flush = () => { if (cur !== null) html += `<div class="sethead">${esc(cur)} <small>${buf.length} 張</small></div><div class="cards">${buf.join("")}</div>`; };
  for (const [c, i] of rows) {
    if (c.set !== cur) { flush(); cur = c.set; buf = []; }
    buf.push(cardRow(slug, c, i));
  }
  flush();
  $("list").innerHTML = html;
}

// ── Stats view (follows the current filters, like the list) ──
function renderStats(rows) {
  const teamCards = new Map(), playerCards = new Map(), playerTeam = new Map(), playerRC = new Set(), playerFirst = new Set();
  const push = (m, k, v) => { if (!m.has(k)) m.set(k, []); m.get(k).push(v); };
  for (const r of rows) {
    const c = r[0];
    const teams = splitMulti(c.team), players = splitMulti(c.player);
    new Set(teams.map(franchise)).forEach(t => push(teamCards, t, r));   // a card counts once per team
    players.forEach((p, j) => {
      push(playerCards, p, r);
      const t = franchise(teams[j] || teams[0] || "");
      // Prefer the team from a single-player card.
      if (!playerTeam.has(p) || players.length === 1) playerTeam.set(p, t);
      if (c.rc) playerRC.add(p);
      if (c.first) playerFirst.add(p);
    });
  }
  const cards = rows.map(r => r[0]);
  const chips = [
    ["總卡數", cards.length, "#818cf8"],
    ["RC 新人卡", cards.filter(c => c.rc).length, "#f59e0b"],
    ...(PROD.use_first ? [["1st", cards.filter(c => c.first).length, "#22d3ee"]] : []),
    ["簽名卡", cards.filter(c => c.group === "Autograph").length, "#10b981"],
    ["球隊數", teamCards.size, "#f97316"],
    ["球員數", playerCards.size, "#f472b6"],
  ];
  const sets = new Map(); cards.forEach(c => sets.set(c.set, (sets.get(c.set) || 0) + 1));
  return `<div class="chips">${chips.map(([l, v, col]) => `<div class="chip"><span>${l}</span><b style="color:${col}">${v}</b></div>`).join("")}</div>
  <div class="statgrid">
    ${rankBox("teams", "球隊出現次數", "支球隊", [...teamCards].map(([t, rs]) => ({ key: "team:" + t, name: t, team: t, rows: rs })))}
    ${rankBox("players", "球員出現次數", "名球員", [...playerCards].map(([p, rs]) => ({ key: "player:" + p, name: p, team: playerTeam.get(p), rows: rs, rc: playerRC.has(p), first: playerFirst.has(p) })))}
    ${sets.size > 1 ? rankBox("sets", "子系列卡數", "個子系列", [...sets].map(([s, n]) => ({ key: "set:" + s, name: s, count: n })), true) : ""}
  </div>`;
}

function rankBox(id, title, unit, items, plain) {
  items.forEach(it => { if (it.count == null) it.count = it.rows.length; });
  items.sort((a, b) => b.count - a.count || collator.compare(a.name, b.name));
  const all = SHOW_ALL.has(id), shown = all ? items : items.slice(0, TOP);
  const max = items[0] ? items[0].count : 1;
  return `<div class="statbox"><div class="stattitle">${title}</div>
    ${shown.map(it => {
      const info = it.team ? teamInfo(it.team) : { color: "#6366f1" };
      const open = !plain && OPEN.has(it.key);
      const isP = it.key.startsWith("player:");
      const star = isP ? `<button class="icon star sm ${Fav.hasPlayer(it.name) ? "on" : ""}" data-act="player" data-name="${esc(it.name)}" title="最愛球員">${Fav.hasPlayer(it.name) ? "★" : "☆"}</button>` : "";
      return `<div class="rank ${open ? "open" : ""}">
        <div class="rankrow" ${plain ? "" : `data-toggle="${esc(it.key)}"`}>
          ${plain ? "" : `<span class="caret">▶</span>`}
          ${it.team ? `<span class="abbr" style="background:${esc(info.color)}">${esc(info.abbr)}</span>` : ""}
          <span class="rname">${esc(it.name)}</span>
          ${it.rc ? '<span class="badge rc">RC</span>' : ""}${it.first ? '<span class="badge first">1st</span>' : ""}
          ${star}<span class="rcount">${it.count}</span>
        </div>
        <div class="bar"><div style="width:${Math.max(2, Math.round(it.count / max * 100))}%;background:${esc(info.color)}cc"></div></div>
        ${open ? `<div class="cards mini">${it.rows.map(([c, i]) => cardRow(slug, c, i)).join("")}</div>` : ""}
      </div>`;
    }).join("")}
    ${items.length > TOP ? `<button class="morebtn" data-more="${id}">${all ? `收起（顯示前 ${TOP} 名）` : `展開全部（共 ${items.length} ${unit}）`}</button>` : ""}
  </div>`;
}

function render() { renderControls(); renderList(); }
window.onFavsChanged = renderList;

// ── Events ──
let qTimer;
$("search").addEventListener("input", e => { clearTimeout(qTimer); qTimer = setTimeout(() => { S.q = e.target.value; renderList(); }, 120); });
$("groups").addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (b) { S.group = b.dataset.v; S.set = "All"; render(); } });
$("sets").addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (b) { S.set = b.dataset.v; render(); } });
$("rc").addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (b) { S.rc = b.dataset.v; render(); } });
$("first").addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (b) { S.first = b.dataset.v; render(); } });
$("team").addEventListener("change", e => { S.team = e.target.value; renderList(); });
$("sort").addEventListener("change", e => { S.sort = e.target.value; renderList(); });
$("favonly").addEventListener("click", () => { S.fav = !S.fav; render(); });
$("view").addEventListener("click", e => {
  const b = e.target.closest("[data-v]"); if (!b) return;
  S.view = b.dataset.v;
  document.querySelectorAll("#view .btn").forEach(x => x.classList.toggle("on", x === b));
  history.replaceState(null, "", location.pathname + location.search + (S.view === "stats" ? "#stats" : ""));
  renderList();
});
$("list").addEventListener("click", e => {
  if (e.target.closest("[data-act]")) return;   // favourite buttons are handled by the document listener
  const t = e.target.closest("[data-toggle]");
  if (t) { const k = t.dataset.toggle; OPEN.has(k) ? OPEN.delete(k) : OPEN.add(k); renderList(); return; }
  const m = e.target.closest("[data-more]");
  if (m) { const k = m.dataset.more; SHOW_ALL.has(k) ? SHOW_ALL.delete(k) : SHOW_ALL.add(k); renderList(); }
});
document.addEventListener("click", e => {
  if (e.target.id === "clear") { Object.assign(S, { q: "", group: "All", set: "All", team: "All", rc: "All", first: "All", fav: false }); $("search").value = ""; render(); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  if (b.dataset.act === "card") {
    const c = PROD.cards[+b.dataset.k.split("|")[1]];
    toast(Fav.toggleCard(slug, c) ? "已加入最愛卡片" : "已移除最愛卡片");
  } else {
    const n = b.dataset.name;
    toast(Fav.togglePlayer(n) ? `已將 ${n} 加入最愛球員` : `已移除最愛球員 ${n}`);
  }
  renderList();
});

(async () => {
  try {
    if (!/^[a-z0-9-]+$/.test(slug)) throw new Error("網址缺少產品代號");
    await loadTeams();
    PROD = await loadJSON("products/" + slug + ".json");
    document.title = PROD.name + " Checklist";
    $("title").textContent = PROD.name;
    const rc = PROD.cards.filter(c => c.rc).length;
    $("subtitle").textContent = `${PROD.cards.length} 張卡片 · ${new Set(PROD.cards.map(c => c.set)).size} 個子系列 · ${rc} 張 RC` +
      (PROD.use_first ? ` · ${PROD.cards.filter(c => c.first).length} 張 1st` : "");
    $("first").hidden = !PROD.use_first;
    $("controls").hidden = false;
    $("view").hidden = false;
    if (location.hash === "#stats") $("view").querySelector('[data-v="stats"]').click();
    render();
  } catch (e) {
    $("title").textContent = "找不到這個產品";
    $("subtitle").textContent = e.message;
  }
})();
</script>
</body>
</html>
